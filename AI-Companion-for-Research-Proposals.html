<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Companion for Research Proposals</title>
<style>
:root{
  --howto:#ECECEA; --bg:#F5F5F2; --paper:#FFFFFD; --ink:#26292C; --muted:#62686E; --line:#E0E0DA;
  --copper:#6C7A89; --copper-d:#4A5967; --copper-l:#E7EAEE;
  --sage:#8A6F55; --sage-l:#F0E8DF;
  --serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  --sans:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--howto:#2E3236; --bg:#1E2022;--paper:#26292C;--ink:#E8EAEB;--muted:#A9AFB4;--line:#3A3F44;--copper:#9AA8B6;--copper-d:#B8C4D0;--copper-l:#2E353C;--sage:#C2A689;--sage-l:#3A322B}
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg)}
nav h1{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.2;margin:0 0 4px}
nav .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
nav .grp{font-size:13px;color:var(--muted);margin:18px 0 6px;font-weight:700}
nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;border-radius:0 6px 6px 0}
nav button:hover{background:var(--copper-l)}
nav button[aria-current="page"]{border-left-color:var(--copper);background:var(--copper-l);font-weight:700}
nav button.done::after{content:" \2713";color:var(--sage)}
main{padding:36px clamp(18px,5vw,64px) 80px;max-width:900px;width:100%}
.mobilebar{display:none}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,38px);line-height:1.15;margin:0 0 6px}
h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:32px 0 8px}
.lede{font-size:18px;color:var(--muted);margin:0 0 24px;max-width:62ch}
p,li{max-width:68ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:16px 0}
.panel.a{border-left:4px solid var(--copper)}
.panel.b{border-left:4px solid var(--sage)}
.panel h4{margin:0 0 8px;font-size:16px}
.panel.a h4{color:var(--copper-d)}
.panel.b h4{color:var(--sage)}
.prompt{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.prompt p{margin:0;flex:1;font-size:15px}
button.copy,button.btn{font:inherit;font-size:13px;border:1px solid var(--copper);background:transparent;color:var(--copper-d);padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
button.copy:hover,button.btn:hover{background:var(--copper);color:#fff}
button.btn.solid{background:var(--copper);color:#fff}
button.btn.solid:hover{background:var(--copper-d)}
textarea,input[type=text],select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:84px;resize:vertical}
textarea:focus,input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
label.q{display:block;font-weight:700;font-size:15px;margin:14px 0 4px}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--paper)}
th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{background:var(--copper-l);font-size:14px}
.tw{overflow-x:auto}
a{color:var(--copper-d);text-decoration:underline;text-underline-offset:2px}
a:visited{color:var(--copper-d)}
a:hover{color:var(--ink)}
td a{font-weight:700}
.watch li{margin:4px 0}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--copper-l);color:var(--copper-d);margin-right:6px}
.pill.b{background:var(--sage-l);color:var(--sage)}
.pager{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.chk input{margin-top:5px}
.ladder{display:grid;grid-template-columns:1fr 230px;gap:8px 14px;align-items:center}
.out{background:var(--copper-l);border-radius:8px;padding:14px 16px;margin-top:12px;font-size:15px;white-space:pre-wrap}
.note{font-size:14px;color:var(--muted)}
.quote{border-left:3px solid var(--copper);padding:2px 0 2px 16px;margin:16px 0;font-family:var(--serif);font-size:19px;line-height:1.45;max-width:62ch}
details{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:12px 0}
summary{cursor:pointer;font-weight:700}
.explain{font-size:14px;color:var(--muted);margin:4px 0 12px}
.sent{margin:14px 0}
.sent .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sent select{width:auto;min-width:130px}
.sent input[type=text]{flex:1;min-width:220px}
.cover{padding:10vh 0 6vh}
.cover .big{font-size:clamp(36px,6vw,62px);line-height:1.1}
.cv1{font-family:var(--serif);font-size:26px;color:var(--copper-d);margin:18px 0 28px}
.cv2{font-size:20px;margin:0}
.cv3{color:var(--muted);font-size:18px;margin:4px 0 32px}
@media(max-width:820px){
  .app{display:block}
  nav{display:none;position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav.open{display:block}
  .mobilebar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .mobilebar strong{font-family:var(--serif);font-weight:400;font-size:18px}
  .ladder{grid-template-columns:1fr}
}
.ic{width:1.15em;height:1.15em;vertical-align:-0.2em;margin-right:8px;color:var(--copper);flex-shrink:0}
h2 .ic{width:1em;height:1em;margin-right:12px}
.prompt .ic{margin-top:4px}
details ul{list-style:none;padding-left:4px}
details li{margin:6px 0}
.dd{padding:0;margin:8px 0}
.dd summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;font-weight:400;list-style:none}
.dd summary::-webkit-details-marker{display:none}
.dd summary::after{content:"\25BE";color:var(--muted);margin-left:8px}
.dd .ddn{font-weight:700;flex:1}
.dd .ddv{color:var(--muted);font-size:14px}
.dd .ddl{padding:4px 14px 10px;border-top:1px solid var(--line)}
.trk{display:flex;align-items:center;gap:12px;margin:10px 0}
.trk .tl{flex:0 0 200px;font-size:14px}
.trk .tt{position:relative;flex:1;height:26px}
.trk .tt::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--line);transform:translateY(-50%)}
.trk .dot{position:absolute;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:var(--copper);border:2px solid var(--paper)}
.axis{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);margin-left:212px}
@media(max-width:820px){.trk{flex-wrap:wrap;gap:4px}.trk .tl{flex-basis:100%}.axis{margin-left:0}}
.howto .key{background:var(--line);border-radius:3px;padding:1px 4px;font-weight:500;font-size:inherit;white-space:nowrap}
.howto{background:var(--howto);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:20px 0;font-size:14px;line-height:1.5}
.howto p{margin:0 0 10px;max-width:none}
.howto p:last-child{margin-bottom:0}
a.openlink{display:inline-block;margin-left:8px;padding:2px 12px;border:1px solid var(--copper);border-radius:6px;font-size:13px;font-weight:400;text-decoration:none}
a.openlink:hover{background:var(--copper);color:var(--paper)}
main:focus{outline:none}
.disc{text-align:justify;hyphens:auto}
.disc p{margin:0 0 14px;font-size:15px;color:var(--muted)}
.disc .dname{color:var(--ink);font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media print{nav,.mobilebar,.pager,button{display:none!important}.app{display:block}}
</style>
</head>
<body>
<div class="mobilebar"><strong>AI Companion for Research Proposals</strong><button class="btn" id="menuBtn" aria-expanded="false">Page list</button></div>
<div class="app">
<nav id="nav" aria-label="Workbook pages"></nav>
<main id="main" tabindex="-1"></main>
</div>

<script>
(function(){
'use strict';

/* ---------- state ---------- */
var S={}, L={}, visited={}, log=[];
try{var saved=window.localStorage.getItem('rpc_state');if(saved){var o=JSON.parse(saved);S=o.S||{};log=o.log||[];visited=o.visited||{};}}catch(e){}
function persist(){try{window.localStorage.setItem('rpc_state',JSON.stringify({S:S,log:log,visited:visited}));}catch(e){}}

/* ---------- helpers ---------- */
var ICONS={"message-circle": "<path d=\"M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z\"/>", "file-text": "<path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><path d=\"M14 2v6h6M8 13h8M8 17h8\"/>", "compass": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M16 8l-2 6-6 2 2-6z\"/>", "grid": "<rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/>", "sliders": "<path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"/>", "lightbulb": "<path d=\"M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z\"/>", "user": "<path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"/><circle cx=\"12\" cy=\"7\" r=\"4\"/>", "search": "<circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"M21 21l-4.3-4.3\"/>", "book": "<path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z\"/><path d=\"M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5\"/>", "help": "<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01\"/>", "flag": "<path d=\"M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z\"/><path d=\"M4 22v-7\"/>", "flask": "<path d=\"M10 2v7.5L4 20a1 1 0 0 0 .9 1.5h14.2A1 1 0 0 0 20 20l-6-10.5V2M8.5 2h7\"/>", "shield": "<path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"/>", "tag": "<path d=\"M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z\"/><path d=\"M7 7h.01\"/>", "check-square": "<path d=\"M9 11l3 3L22 4\"/><path d=\"M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11\"/>", "edit": "<path d=\"M12 20h9\"/><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/>", "briefcase": "<rect x=\"2\" y=\"7\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/>", "eye": "<path d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>"};
var TOOLIC={'ChatGPT':'message-circle','Claude':'message-circle','Paperpal':'edit','Jenni AI':'edit','Elicit':'book','Consensus':'search','SciSpace':'file-text','Perplexity':'search','Scite':'check-square'};
var PAGEIC={start:'message-circle',proposal:'file-text',approach:'compass',tools:'grid',who:'sliders',topic:'lightbulb',position:'user',gap:'search',lit:'book',rq:'help',contrib:'flag',methods:'flask',ethics:'shield',title:'tag',abs:'file-text',review:'check-square',log:'edit'};
function icon(n){return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[n]||'')+'</svg>';}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ta(key,label,ph,rows){L[key]=label;return '<label class="q" for="f_'+key+'">'+esc(label)+'</label><textarea id="f_'+key+'" data-k="'+key+'" placeholder="'+esc(ph||'')+'"'+(rows?' rows="'+rows+'"':'')+'></textarea>';}
function prompts(list){return list.map(function(p){return '<div class="prompt">'+icon('message-circle')+'<p>'+esc(p)+'</p><button class="copy" type="button">Copy prompt</button></div>';}).join('');}
function bullets(list){return '<ul class="watch">'+list.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';}
function sel(key,label,opts){L[key]=label;return '<select data-k="'+key+'" aria-label="'+esc(label)+'">'+opts.map(function(o,i){return '<option value="'+(i===0?'':esc(o))+'">'+esc(o)+'</option>';}).join('')+'</select>';}

/* ---------- practice page template ---------- */
function practice(c){
  var h='<h2>'+c.title+'</h2><p class="lede">'+c.lede+'</p>';
  h+=toolLine(c.tools,c.stage)+'<h3>'+c.intro+'</h3>'+prompts(c.prompts);
  if(c.mid) h+=c.mid;
  h+='<h3>'+icon('eye')+'Watch for</h3>'+bullets(c.watch);
  h+='<p style="margin-top:18px"><button class="btn" type="button" data-log="'+esc(c.title)+'">Add an entry to my AI log</button></p>';
  return h;
}

/* ---------- pages ---------- */
var pages=[];
function add(id,group,title,fn,after){pages.push({id:id,group:group,title:title,render:fn,after:after});}

var EXAMPLES=[]; /* each item: [title, url, note] */

/* 0. Front page */
add('cover','Introduction','Front page',function(){
  return '<div class="cover"><h2 class="big">AI Companion for Research Proposals</h2><p class="cv2">Dr Àngels Trias i Valls</p><p class="cv3">PER701 Masters Perspectives, International Relations, 2026</p><p><button class="btn solid" type="button" data-i="1">Begin</button></p></div>';
});

/* 1. Where are you with AI */
var uses=['Finding sources or articles','Summarising readings','Choosing a topic or an essay question','Planning the structure of an essay','Writing or rewriting sentences','Checking grammar and style','Understanding hard concepts or theories','Answering an activity or a task from class','Making references and citations','Deciding what my argument is'];
var levels=['I do this myself','AI gives ideas and I decide','AI drafts and I edit','AI does most of it','I do not do this task'];
add('start','Introduction','Where are you with AI?',function(){
  var h='<h2>Where are you with AI?</h2><p class="lede">This page asks how you currently use AI in your university work. Its purpose is to help you reflect on your own practice. It is not a test, and there are no right or wrong answers. Your responses remain in this browser and are not shared with anyone.</p>';
  h+='<h3>Which tasks do you use AI for?</h3><p>Select each task for which you have used AI in the last month.</p>';
  uses.forEach(function(u,i){L['start:use'+i]=u;h+='<div class="chk"><input type="checkbox" id="u'+i+'" data-k="start:use'+i+'"><label for="u'+i+'">'+u+'</label></div>';});
  h+='<h3>Who does the work for each task?</h3><p>For each task, choose the statement that best describes what usually happens. The statements range from doing the task yourself to AI doing most of it.</p><div class="ladder">';
  uses.forEach(function(u,i){h+='<div>'+u+'</div><div>'+sel('start:lad'+i,u,['Select an option'].concat(levels))+'</div>';});
  h+='</div><p style="margin-top:16px"><button class="btn solid" type="button" id="seePic">Show a summary of my answers</button></p><div id="pic"></div>';
  h+='<h3>Which AI tools do you use?</h3>'+ta('start:tools','Write the name of each tool and what you use it for.','For example: ChatGPT for summarising readings',3);
  h+='<h3>Reflection</h3>'+ta('start:q1','Can you think of a time when it felt ‘easy’ to hand the thinking to AI? It may have happened without you noticing.','',4);
  return h;
},function(){
  document.getElementById('seePic').onclick=function(){
    var c=[0,0,0,0,0];
    uses.forEach(function(u,i){var k=levels.indexOf(S['start:lad'+i]);if(k>-1)c[k]++;});
    var tot=c[0]+c[1]+c[2]+c[3];
    var msg='You answered for '+tot+' tasks. You do '+c[0]+' of them yourself, AI gives ideas and you decide in '+c[1]+', AI drafts and you edit in '+c[2]+', and AI does most of the work in '+c[3]+'.\n\n';
    if(!tot) msg='Choose an answer for at least one task before you select this button.';
    else if(c[3]+c[2]>=tot/2) msg+='In your answers, AI often produces the first draft. This session may help you take more decisions back, especially decisions about your topic, your research gap and your method.';
    else if(c[1]>=tot/2) msg+='In your answers, you mostly use AI as a source of ideas. This session may help you question those ideas more carefully.';
    else msg+='In your answers, you keep most of the work for yourself. This session may show you where AI can still help you think more clearly.';
    document.getElementById('pic').innerHTML='<div class="out">'+esc(msg)+'</div>';
  };
});

/* 2. What is a proposal */
add('proposal','Introduction','What makes a research proposal',function(){
  var h='<h2>What makes a research proposal</h2><p class="lede">This page explains what a research proposal contains, because the later pages show how AI can support each part. A research proposal is a clear, focused plan that outlines what you want to study, why it matters, and how you will do the work.</p>';
  h+='<h3>The four Ws</h3><p>A proposal answers four questions: what, where, how and why. The table explains what each question asks you to state.</p><div class="tw"><table><tr><th>Question</th><th>What you explain</th></tr>';
  h+='<tr><td><strong>What</strong></td><td>What you plan to investigate. This is your research question.</td></tr>';
  h+='<tr><td><strong>Where</strong></td><td>The people, the place, the history and the context of your research, and the theories that you use.</td></tr>';
  h+='<tr><td><strong>How</strong></td><td>The strategies, tools and perspectives that you will use to collect data, and any issues that may arise with that collection.</td></tr>';
  h+='<tr><td><strong>Why</strong></td><td>Your contribution to the field: the gap that you address, and why the work matters and is needed.</td></tr></table></div>';
  h+='<h3>The parts of a proposal</h3><p>A proposal usually contains the parts listed below. Institutions and funders vary in what they require, so check the guidance for your own module.</p>'+bullets(['Title','Abstract','A brief introduction that shows what original research you propose','A critical summary of existing literature','The hypothesis or research question, and the objectives','Methodology, including how you collect data and the limits of your methods','Your positioning: who you are, and how that affects relationships with the people you study (positionality and power)','Ethical considerations towards informants','Summary and conclusions']);
  h+='<h3>Features of a good proposal</h3>'+bullets(['Be clear, objective, succinct and realistic in your objectives.','Show that you have identified a clear research gap. In other words, you propose an original research project that makes a significant contribution to knowledge.','Explain why this research should be funded and why it is important or timely.','State and justify your objectives clearly.','Answer the question: how will the research benefit wider society or contribute to the research community?']);
  h+='<h3>Writing style</h3>'+bullets(['Give a clear project title.','Use section headings if allowed.','Write short paragraphs and short sentences.','Add images, charts or diagrams if your discipline allows them.']);
  h+='<p class="note">The University of Edinburgh publishes further guidance: <a href="https://study.ed.ac.uk/sites/default/files/2025-11/Guidance%20on%20how%20to%20write%20a%20research%20proposal%202025.pdf" target="_blank" rel="noopener">guidance on how to write a research proposal</a>.</p>';
  h+='<h3>Look at some research proposals</h3><p>Your tutor will share example research proposals. Read one example and look for the sentences listed in the table below. Finding these sentences helps you see how researchers state the ideas that you will write about in your own proposal.</p>';
  if(EXAMPLES.length){h+='<ul>'+EXAMPLES.map(function(x){return '<li><a href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+'</a>'+(x[2]?': '+x[2]:'')+'</li>';}).join('')+'</ul>';}
  h+='<div class="tw"><table><tr><th>Look for a sentence that</th><th>Sentences of this kind often begin with</th></tr>'+[['states what the author investigates','This dissertation examines... or My research question is...'],['states the argument','In this dissertation I will argue that...'],['places the research in a location, a group and a time','The research takes place in...'],['names the research gap','Scholars have not yet examined... or The gap this research addresses is...'],['explains why the research matters','This research will contribute to...'],['explains how the author will collect data','I will collect data through...'],['describes the limits of the method','A limitation of this method is...'],['explains the position of the author in relation to the people studied','I write from the position of...'],['addresses ethical considerations','The main ethical consideration is...']].map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table></div>';
  return h;
});

/* 3. Working with AI to develop judgement */
add('approach','Introduction','Working with AI to develop academic judgement',function(){
  var h='<h2>Working with AI to develop academic judgement</h2><p class="lede">Most AI in education resources focus on how to use AI. This session helps you explore how to think with AI while you become a researcher.</p>';
  h+='<p>The session is based on the idea that academic judgement is the ability to evaluate ideas, question assumptions and make decisions that you can justify. It is not a test, and there are no right or wrong answers. You may disagree with some of the ideas, and this disagreement is part of learning.</p>';
  h+='<h3>Delegate, collaborate or keep</h3><p>A research proposal involves many decisions, and you can handle each decision in one of three ways. You can delegate a task to AI, which means that AI completes the task and you review the result. You can collaborate with AI, which means that you and AI work on the task together. You can keep a task for yourself, which means that you complete it without AI.</p><p>Choosing between these options develops your academic judgement, because you decide which thinking you will keep. Outsourcing your thinking to a tool without making that choice removes your own judgement from the proposal.</p>';
  h+='<h3>How each practice page works</h3><p>Each practice page follows the same four steps.</p><ol><li>Open the list of recommended AI tools for the stage of the proposal, and choose one tool.</li><li>Copy a prompt from the page and paste it into that tool.</li><li>Read the response critically, and decide which parts of it, if any, you will use.</li><li>If you wish to keep a record, add an entry to your AI log.</li></ol>';
  h+='<h3>What you can have by the end of the session</h3>'+bullets(['A written record of how your research ideas developed','A record of what you asked AI and what AI produced','Notes that evaluate the responses AI gave you','A clearer understanding of your own position in relation to the people you research']);
  return h;
});

function howTo(stage){return '<div class="howto"><p>Below, select a prompt and click <span class="key">Copy prompt</span>. This will copy the full text of the prompt to your clipboard.</p><p>Next, choose one of the recommended AI models and click Open and Paste.</p><p>Once you have pasted the prompt, experiment with the response. If you have never used one of the suggested AI models before, create a free account and try it. Different models often produce different results, and exploring a range of tools will strengthen your ability to judge their strengths, limitations and appropriate uses.</p></div>';}
function toolLine(names,stage){
  return howTo(stage)+'<details><summary>'+icon('briefcase')+'Best AI tools for '+stage+'</summary><ul>'+names.map(function(n){var t=tools.filter(function(x){return x[0]===n;})[0];return '<li>'+icon(TOOLIC[t[0]])+'<a href="'+t[1]+'" target="_blank" rel="noopener">'+t[0]+'</a>: '+t[2]+'. <a class="openlink" href="'+t[1]+'" target="_blank" rel="noopener" aria-label="Open '+t[0]+'">Open</a></li>';}).join('')+'</ul></details>';
}

  tools.forEach(function(t){h+='<tr><td>'+icon(TOOLIC[t[0]])+'<a href="'+t[1]+'" target="_blank" rel="noopener">'+t[0]+'</a></td><td>'+t[2]+'</td><td>'+t[3]+'</td></tr>';});
  h+='</table></div>';
  h+='<h3>A combination of tools</h3><p>Researchers can also combine tools. The table below shows one combination, with one tool for each stage of a proposal.</p><div class="tw"><table><tr><th>Stage</th><th>Tool</th></tr><tr><td>Literature</td><td>Consensus, Elicit</td></tr><tr><td>Deep reasoning</td><td>Claude</td></tr><tr><td>Drafting and critique</td><td>ChatGPT</td></tr><tr><td>Citation checking</td><td>Scite</td></tr><tr><td>Paper analysis</td><td>SciSpace</td></tr></table></div>';
  h+='<p>That combination would cover almost the entire proposal lifecycle from idea generation through to final submission.</p>';

/* 5. Who is thinking */
var whoItems=[['Generating topic ideas','g'],['Finding papers','g'],['Identifying a gap','e'],['Deciding significance','e'],['Choosing methods','e'],['Writing sentences','g'],['Making academic judgements','e']];
var whoPts={'Mostly me':0,'Shared with AI':1,'Mostly AI':2};
add('who','Introduction','Who is doing the thinking when working with AI?',function(){
  var h='<h2>Who is doing the thinking when working with AI?</h2><p class="lede">AI can contribute effectively to support you in preparing a research proposal.</p>';
  h+='<p>Some parts of research are evaluative, and others are generative. An evaluative part asks for your judgement: you weigh the evidence, decide what a finding means, and assess whether the output of a tool is sound. A generative part produces material such as ideas, lists and drafts. Generative AI works best when it produces material, and it works less well when it makes evaluative judgements.</p>';
  h+='<p>The table lists activities that you carry out when you prepare a research proposal. For each activity, choose who you think should do it. There are no right or wrong answers, and your choices may differ from those of your classmates.</p>';
  h+='<div class="tw"><table><tr><th>Activity</th><th>My view</th></tr>';
  whoItems.forEach(function(w,i){h+='<tr><td>'+w[0]+'</td><td>'+sel('who:'+i,w[0],['Select an option','Mostly me','Shared with AI','Mostly AI'])+'</td></tr>';});
  h+='</table></div><p style="margin-top:14px"><button class="btn solid" type="button" id="seeWho">Show what my choices suggest</button></p><div id="whoOut"></div>';
  h+='<h3>Three possible outcomes</h3><p>Researchers may become more capable through working with AI, but this depends on how they use it. The following three students illustrate different patterns of use.</p><p>One student uses AI to explore alternative perspectives, test research questions, critique arguments, compare methodologies, identify assumptions and simulate reviewers. Over time, this student may improve at framing questions, evaluating evidence, recognising weaknesses and articulating a contribution.</p><p>A second student uses AI mainly to rewrite sentences, generate summaries and produce first drafts. The quality of the work may improve while the research capability of the student stays the same.</p><p>A third student delegates literature synthesis, question formulation, gap identification and method selection to AI without understanding the reasoning. The proposal may look convincing, but this student may become less able to carry out these tasks independently and critically.</p>';
  return h;
},function(){
  document.getElementById('seeWho').onclick=function(){
    var g=[],e=[],miss=false,eAI=[],gMe=0,gN=0;
    whoItems.forEach(function(w,i){var v=S['who:'+i];if(!(v in whoPts)){miss=true;return;}
      if(w[1]==='g'){g.push(whoPts[v]);gN++;if(v==='Mostly me')gMe++;}else{e.push(whoPts[v]);if(v==='Mostly AI')eAI.push(w[0].toLowerCase());}});
    var out=document.getElementById('whoOut');
    if(miss){out.innerHTML='<div class="out">Choose a view for every activity before you select this button.</div>';return;}
    function avg(a){return a.reduce(function(x,y){return x+y;},0)/a.length;}
    var ag=avg(g),ae=avg(e),msg;
    if(ae>ag) msg='Your choices give AI a larger role in evaluative activities than in generative activities.';
    else if(ae<ag) msg='Your choices give AI a larger role in generative activities than in evaluative activities.';
    else msg='Your choices give AI an equal role in generative and evaluative activities.';
    msg+='\n\n';
    if(eAI.length) msg+='You chose mostly AI for these evaluative activities: '+eAI.join(', ')+'. Evaluative activities depend on your own judgement, because you remain responsible for the decisions in your proposal. You can ask AI to challenge your view and keep the final decision for yourself.';
    else if(gMe===gN) msg+='You chose to carry out every generative activity yourself. AI may be able to widen your options in these activities, for example by listing alternative topics or papers for you to assess.';
    else msg+='Your choices give AI a role in generating material and keep the evaluation with you, which matches the distinction described above. You can record your evaluative decisions in your AI log.';
    out.innerHTML='<div class="out">'+esc(msg)+'</div>';
  };
});

 id:'gap',stage:'finding a research gap',tools:['Elicit','Consensus'],title:'Find your research gap',lede:'A research gap is an area of a topic that scholars have not yet examined adequately. The gap may be a question without a clear answer, a group or place that has received little study, or a debate in which the evidence conflicts. Your proposal identifies one gap and explains why the gap matters.',

add('position','Practice','8. Your positioning',function(){
  var h='<h2>Your positioning</h2><p class="lede">Positioning describes where a researcher stands in relation to the people being studied and in relation to social structures of power. This activity is based on the idea of positionality in qualitative research and on intersectionality, an approach that examines how different dimensions of social position combine to shape people’s experiences.</p>';
  if(WHEEL_IMG) h+='<p><img src="'+WHEEL_IMG+'" alt="The wheel of power" style="max-width:100%;height:auto"></p>';
  h+='<p>This activity is not a test, and it does not measure your worth, character or ability. It cannot capture the full complexity of a person’s life. There are no right or wrong answers, and you may disagree with some options or feel that they do not represent you. This is part of learning to use the idea.</p>';
  h+='<p>The purpose of the activity is to help you examine how close you are to positions of power and to social norms. Your positions may shape how informants see you, whether they trust you and how they speak to you. Examining them can help you decide what to address in relation to the groups and informants that you plan to research.</p>';
  h+='<h3>Positions combine</h3><p>Social positions rarely operate in isolation. Advantages associated with one dimension can be strengthened, weakened or challenged by another. As a result, a person may be close to the centre in many dimensions while still experiencing exclusion in others.</p><p>Kimberlé Crenshaw first demonstrated this through her work on Black women, whose experiences could not be fully explained by looking at race alone or gender alone.</p><p>The meaning of your position also depends on the context. A position that gives advantages in one setting may give none in another.</p>';
  h+='<h3>Map your positioning</h3><p>Each menu below describes one dimension of social position. Open a menu and select every option that applies to you. You can select more than one option in a menu. Your selections appear on the map further down the page.</p>';
  wheel.forEach(function(w,i){
    h+='<details class="dd" data-cat="'+i+'"><summary><span class="ddn">'+w[0]+'</span><span class="ddv">None selected</span></summary><div class="ddl">';
    w[1].forEach(function(o,j){var k='position:w'+i+'o'+j;L[k]=w[0]+': '+o[0];h+='<div class="chk"><input type="checkbox" id="'+k.replace(':','_')+'" data-k="'+k+'"><label for="'+k.replace(':','_')+'">'+o[0]+'</label></div>';});
    h+='</div></details>';
  });
  h+=ta('position:other','Other aspects of my positioning','For example race and ethnicity, religion, age or disability, if they matter for this research.',3);
  h+='<h3>Your map</h3><p>The map shows one line for each dimension. The left end of a line represents positions that are more likely to align with dominant social norms and institutions, which this activity calls the centre. The right end represents positions that are more likely to experience marginalisation or exclusion, which this activity calls the periphery. A dot in the middle represents a position between the two. Options that you marked as not sure, or as prefer not to say, do not appear on the map.</p><div id="posOut"></div>';
  h+='<p>The map is a simplified example. Placing each option on a single line cannot show how dimensions interact, and the placement of each option depends on the country, institution and social setting of your research. You may disagree with it.</p>';
  if(WHEEL_URL) h+='<p>If you wish to try a more complex and more intersectionally represented version of the wheel of power, <a href="'+WHEEL_URL+'" target="_blank" rel="noopener">select this link</a>.</p>';
  h+='<h3>Consider your relationships with informants</h3><p>Each of your positions may change how informants perceive you, whom they trust and whom they distrust. Positions close to the centre may support relationships of trust and some equality with informants, or they may suggest a hierarchy between you and them. For example, informants who see you only as wealthy, or only as female, may respond to you according to the social values attached to wealth or gender in their context. These responses may affect your ability to carry out the research.</p><p>Answer the two questions below, and then write a short response to the third.</p>';
  var q1='Could the positions in which you are close to the centre, including financial advantage, affect how much your informants trust you?';
  var q2='Could your informants see you as very different from themselves, or as someone whose beliefs they strongly disagree with?';
  h+='<p style="font-weight:700;margin:14px 0 4px">'+q1+'</p>'+sel('position:q1',q1,['Select an option','Yes','No','Not sure']);
  h+='<p style="font-weight:700;margin:14px 0 4px">'+q2+'</p>'+sel('position:q2',q2,['Select an option','Yes','No','Not sure']);
  h+=ta('position:r1','Which of your positions could matter most for your research, and in what way?','',4);
  h+=toolLine(['Claude','ChatGPT'],'questioning your positioning')+'<h3>AI is useful for questioning your positioning in relation to your group or informants. You can ask:</h3>'+prompts(['Ask me questions about my positioning and intersectionality, or the places of power I may occupy. Do not tell me who I am.']);
  h+='<h3>'+icon('eye')+'Watch for</h3>'+bullets(['AI may infer identity from stereotypes. You define your own positioning.','AI may give generic answers about bias. Ask it to address specific relationships in your project.']);
  h+='<p style="margin-top:18px"><button class="btn" type="button" data-log="Your positioning">Add an entry to my AI log</button></p>';
  return h;
},function(){
  function dot(o,side,idx,n){
    var st=side==='c'?'left:calc(3% + '+(idx*22)+'px)':side==='p'?'right:calc(3% + '+(idx*22)+'px)':'left:calc(50% + '+((idx-(n-1)/2)*22-9)+'px)';
    return '<span class="dot" title="'+esc(o[0])+'" style="'+st+'"></span>';
  }
  function draw(){
    var rows='',total=0;
    wheel.forEach(function(w,i){
      var chosen=[],plotted={c:[],m:[],p:[]};
      w[1].forEach(function(o,j){if(S['position:w'+i+'o'+j]){chosen.push(o);if(o[1]!=='n')plotted[o[1]].push(o);}});
      total+=chosen.length;
      var dd=document.querySelector('.dd[data-cat="'+i+'"] .ddv');
      if(dd)dd.textContent=chosen.length?chosen.length+' selected':'None selected';
      var dots='';['c','m','p'].forEach(function(k){plotted[k].forEach(function(o,idx){dots+=dot(o,k,idx,plotted[k].length);});});
      rows+='<div class="trk"><div class="tl">'+w[0]+'</div><div class="tt">'+dots+'</div></div>';
    });
    var out=document.getElementById('posOut');
    if(!total){out.innerHTML='<div class="out" style="white-space:normal">No options have been selected yet. Open a menu and select an option to add it to the map.</div>';return;}
    out.innerHTML='<div class="out" style="white-space:normal"><div class="axis"><span>Centre: more aligned with dominant norms</span><span>Periphery: more likely to face exclusion</span></div>'+rows+'</div>';
  }
  document.getElementById('main').addEventListener('change',function(e){if(e.target.type==='checkbox'&&e.target.closest('.dd'))draw();});
  draw();
});

/* 15. Abstract */
var sentences=[
 {k:'s1',pre:'This project will',opts:{'argue':'To argue is to take a position and defend it. Your next words state your claim and your main reason.','discuss':'To discuss is to weigh several views. Your next words name those views.','examine':'To examine is to look closely at a case or a body of evidence. Your next words name the case or the evidence.','explore':'To explore is to investigate a question when you do not yet know the answer, which suits an early stage of research. Your next words state what you want to find out.','compare':'To compare is to set two or more cases side by side. Your next words name the cases.','challenge':'To challenge is to question an existing view. Your next words name that view.'},ph:'Finish the sentence, for example: that ... or how ... or why ...'},
 {k:'s2',pre:'The gap this research addresses is',ph:'what scholars have not yet examined'},
 {k:'s3',pre:'I will collect data through',opts:{'interviews':'Interviews involve talking with people. Your next words say whom you will interview and how many people.','participant observation':'Participant observation involves spending time in a setting and taking part in it. Your next words say where and for how long.','document analysis':'Document analysis involves reading and interpreting texts. Your next words say which documents and why.','surveys':'Surveys ask many people the same questions. Your next words say whom you will ask and how you will reach them.','digital ethnography':'Digital ethnography studies online communities and practices. Your next words say which platforms.','a mixed method':'A mixed method combines more than one method. Your next words say how the methods work together.'},ph:'Say whom or what you will study, and why this method suits your question'},
 {k:'s4',pre:'I write from the position of',ph:'your position in relation to the people you study, and how this position may shape the research'},
 {k:'s5',pre:'This research will contribute to',ph:'the field of study, and the people to whom the research matters'}
];
add('abs','Practice','10. Abstract',function(){
  var h='<h2>Draft your abstract</h2><p class="lede">An abstract is a short summary of the whole proposal. This page helps you build a first draft from five sentence openings, which you then rewrite in your own words. For the first and third openings, choose a word from the menu to see what it commits you to.</p>';
  sentences.forEach(function(s){
    L['abs:'+s.k+'v']=s.pre+' (choice)';L['abs:'+s.k+'t']=s.pre;
    h+='<div class="sent"><div class="row"><span>'+s.pre+'</span>';

    h+='<input type="text" data-k="abs:'+s.k+'t" placeholder="'+esc(s.ph)+'" aria-label="'+esc(s.pre)+' text"></div>';

  h+=toolLine(['Paperpal','Claude'],'drafting an abstract')+'<h3>AI is useful for critiquing an abstract. You can ask:</h3>'+prompts(['Read my abstract. Which part is the least clear?','Does my abstract answer What, Where, How and Why? Show me where.','Which sentence promises more than my method can deliver?']);

/* 16. Mock reviewer */
add('review','Practice','11. Mock reviewer',function(){

  h+=toolLine(['Claude','ChatGPT'],'reviewing a proposal')+'<h3>AI is surprisingly useful for critique. You can ask:</h3>'+prompts(['Act as a mock reviewer. Read my proposal and identify weaknesses, gaps and unclear claims.','Act as three reviewers: a methodologist, a theorist and an ethics committee member. Give three criticisms from each reviewer.','Which part of my proposal is least feasible in my time and budget?','Where does my argument not follow from my evidence?','Does my proposal meet these funder criteria: [criteria]?']);
  h+='<h3>Respond to the reviewer</h3><p>Choose three criticisms that AI gave you. For each criticism, decide whether to accept it, to adjust your proposal in response, or to reject it, and write your reason.</p>';
  for(var i=0;i<3;i++){h+='<div class="panel">'+ta('review:c'+i,'Criticism '+(i+1),'',2)+'<label class="q" for="rd'+i+'">My decision</label>'+sel('review:d'+i,'Decision '+(i+1),['Select an option','Accept','Adjust','Reject'])+ta('review:r'+i,'My reason','',2)+'</div>';}
  h+='<p style="margin-top:18px"><button class="btn" type="button" data-log="Work with a mock reviewer">Add an entry to my AI log</button></p>';

/* 17. Log */
add('log','Practice','Your AI log',function(){
  var h='<h2>Your AI log</h2><p class="lede">An AI log is a record of how you use AI while you prepare your proposal. Each entry records what you asked AI, what AI produced, what you kept, what you rejected and your reasons. The log helps you see the decisions that you made. It remains in this browser and is not shared with anyone.</p>';
  h+='<p><button class="btn solid" type="button" id="addRow">Add a log entry</button></p><div id="logRows"></div>';
  h+='<h3>Reflection</h3>'+ta('log:final','Can I now explain how I made each decision in my proposal? Which of these decisions did I make myself?','',5);
  h+='<h3>Save a copy of your answers</h3><p>The first button below copies everything that you have written on these pages into one block of text. Paste the text into a document and save the document. The second button deletes your answers from this browser.</p><p><button class="btn solid" type="button" id="copyAll">Copy all my answers</button> <button class="btn" type="button" id="clearAll">Delete all my answers</button></p><textarea id="allOut" rows="8" readonly placeholder="Your answers appear here after you select the copy button."></textarea>';
  h+='<p class="note">Your answers remain in this browser only if your browser allows storage. Copy your answers to a document before you close the page.</p>';
  return h;
},function(){
  var stage=window.__logStage||'';window.__logStage='';
  function draw(){
    var h='';
    log.forEach(function(r,i){
      h+='<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px"><strong>Entry '+(i+1)+'</strong><button class="btn" type="button" data-del="'+i+'">Delete this entry</button></div>';
      [['stage','Stage of the proposal'],['asked','What I asked AI'],['gave','What AI produced'],['kept','What I kept'],['rejected','What I rejected'],['why','My reasons']].forEach(function(f){
        h+='<label class="q">'+f[1]+'</label>'+(f[0]==='stage'?'<input type="text" data-lr="'+i+'|'+f[0]+'" value="'+esc(r[f[0]]||'')+'">':'<textarea rows="2" data-lr="'+i+'|'+f[0]+'">'+esc(r[f[0]]||'')+'</textarea>');
      });
      h+='</div>';
    });
    document.getElementById('logRows').innerHTML=h||'<p class="note">No log entries have been added yet. Select “Add a log entry” to create the first entry.</p>';
  }
  function addRow(st){log.push({stage:st||''});persist();draw();}
  document.getElementById('addRow').onclick=function(){addRow('');};
  if(stage)addRow(stage);else draw();
  var box=document.getElementById('logRows');
  box.addEventListener('input',function(e){var k=e.target.getAttribute('data-lr');if(k){var p=k.split('|');log[+p[0]][p[1]]=e.target.value;persist();}});
  box.addEventListener('click',function(e){var d=e.target.getAttribute('data-del');if(d!==null){log.splice(+d,1);persist();draw();}});
  document.getElementById('copyAll').onclick=function(){
    var out='AI COMPANION FOR RESEARCH PROPOSALS\n\n';
    pages.forEach(function(p){
      var lines=[];Object.keys(S).forEach(function(k){if(k.indexOf(p.id+':')===0&&S[k]&&S[k]!==true&&S[k]!=='Select an option')lines.push((L[k]||k)+'\n'+S[k]);});
      if(lines.length)out+='## '+p.title+'\n'+lines.join('\n\n')+'\n\n';
    });
    if(log.length){out+='## AI log\n';log.forEach(function(r,i){out+='Entry '+(i+1)+' | Stage: '+(r.stage||'')+'\nWhat I asked AI: '+(r.asked||'')+'\nWhat AI produced: '+(r.gave||'')+'\nWhat I kept: '+(r.kept||'')+'\nWhat I rejected: '+(r.rejected||'')+'\nMy reasons: '+(r.why||'')+'\n\n';});}
    var o=document.getElementById('allOut');o.value=out;o.select();copyText(out,this);
  };
  document.getElementById('clearAll').onclick=function(){if(window.confirm('Delete everything you have written in this session?')){S={};log=[];visited={};persist();go('start');}};
});

/* ---------- engine ---------- */
var cur=0, nav=document.getElementById('nav'), main=document.getElementById('main');
var afters={};
pages.forEach(function(p){});

function copyText(txt,btn){
  function ok(){if(btn){var o=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=o;},1400);}}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fb);}else fb();
  function fb(){var t=document.createElement('textarea');t.value=txt;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok();}catch(e){}document.body.removeChild(t);}
}

function buildNav(){
  var h='<h1>AI Companion for Research Proposals</h1>',g='';
  pages.forEach(function(p,i){
    if(p.group!==g){g=p.group;h+='<div class="grp">'+g+'</div>';}
    h+='<button type="button" data-i="'+i+'"'+(i===cur?' aria-current="page"':'')+(visited[p.id]?' class="done"':'')+'>'+p.title+'</button>';
  });
  nav.innerHTML=h;
}

function go(id){
  var i=typeof id==='number'?id:pages.findIndex(function(p){return p.id===id;});
  if(i<0)return;cur=i;var p=pages[i];
  main.innerHTML=p.render()+(i===0?'':'<div class="pager">'+(i>0?'<button class="btn" type="button" data-i="'+(i-1)+'">Previous page</button>':'<span></span>')+(i<pages.length-1?'<button class="btn solid" type="button" data-i="'+(i+1)+'">Next page</button>':'<button class="btn solid" type="button" data-i="0">Back to start</button>')+'</div>');
  main.querySelectorAll('[data-k]').forEach(function(el){
    var k=el.getAttribute('data-k');
    if(el.type==='checkbox'){el.checked=!!S[k];el.addEventListener('change',function(){S[k]=el.checked;visited[p.id]=true;persist();});}
    else{if(S[k]!==undefined)el.value=S[k];var ev=el.tagName==='SELECT'?'change':'input';el.addEventListener(ev,function(){S[k]=el.value;visited[p.id]=true;persist();});}
  });
  if(p.after)p.after();
  visited[p.id]=true;persist();buildNav();
  nav.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');
  var h2=main.querySelector('h2');if(h2&&PAGEIC[p.id])h2.insertAdjacentHTML('afterbegin',icon(PAGEIC[p.id]));
  main.focus({preventScroll:true});window.scrollTo(0,0);
}
window.go=go;
